version: '3.8'

services:
  mongodb:
    image: my_mongo_image
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my_mongo_container
    ports:
      - "5000:27017"
    restart: always

  backend:
    image: backend-app
    build:
      context: ./backend
      dockerfile: Dockerfile_be
    container_name: backend_container
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://my_mongo_container:27017/my_db

  frontend:
    image: frontend-app
    build:
      context: ./frontend
    container_name: frontend_container
    ports:
      - "4200:4200"
    restart: always
    depends_on:
      - backend
